<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territory Game</title>
    <link rel="stylesheet" href="game.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script src="game.js" defer></script>
</head>

<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center p-3">

        <div class="card shadow border-0 p-4 text-center px-10">

            <h1 class="fw-bold mb-6">Territory Game</h1>

            <div class="row justify-content-center g-3 mb-6">

                <div class="col-5">
                    <div id="player1Box" class="border border-2 border-black rounded-3 p-3">
                        <p class="mb-0 fw-bold">Player 1</p>
                        <p id="player1Score" class="fw-bold fs-lg mb-0">0</p>
                    </div>
                </div>

                <div class="col-5">
                    <div id="player2Box" class="border border-2 rounded-3 p-3">
                        <p class="mb-0 fw-bold">Player 2</p>
                        <p id="player2Score" class="fw-bold fs-lg mb-0">0</p>
                    </div>
                </div>

            </div>

            <div id="board"></div>

            <div class="text-center mt-5">
                <a href="menu.html" class="btn btn-primary btn-lg px-10">
                    Back
                </a>
            </div>

        </div>

    </div>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
