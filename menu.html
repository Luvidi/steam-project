<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territory Game</title>
    <link rel="stylesheet" href="menu.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script src="menu.js" defer></script>
</head>

<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center p-3">

        <div class="card shadow border-0 rounded-4 p-10 w-100 d-flex align-items-center" style="max-width: 600px;">

            <h1 class="fw-bold text-center mb-10">Game Setup</h1>

            <div class="accordion w-100">
                <details class="accordion-item">
                    <summary class="accordion-header d-flex gap-5">
                        <span class="fw-bold flex-grow-1">Board</span>
                        <select class="form-control" id="boardType" style="max-width: 150px;">
                            <option value="6x6" selected>6×6</option>
                            <option value="8x8">8×8</option>
                            <option value="custom">Custom</option>
                        </select>
                        <svg class="accordion-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m2 5 6 6 6-6" />
                        </svg>
                    </summary>
                    <div class="accordion-body d-flex align-items-center flex-column">
                        <div id="customBoard" class="d-none w-100">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <label for="boardHeight" class="fw-bold flex-grow-1">
                                    Height
                                </label>
                                <input type="number" class="form-control" id="boardHeight" min="4" max="20" value="6"
                                    style="max-width: 150px;">
                            </div>

                            <div class="d-flex align-items-center gap-3 mb-6">
                                <label for="boardWidth" class="fw-bold flex-grow-1">
                                    Width
                                </label>
                                <input type="number" class="form-control" id="boardWidth" min="4" max="20" value="6"
                                    style="max-width: 150px;">
                            </div>
                        </div>

                        <div id="board"></div>
                    </div>
                </details>

                <details class="accordion-item">
                    <summary class="accordion-header d-flex gap-5">
                        <span class="fw-bold flex-grow-1">Player 1</span>
                        <select class="form-control" id="player1Type" style="max-width: 150px;">
                            <option value="0" selected>Human</option>
                            <option value="1">Computer</option>
                        </select>
                        <svg class="accordion-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m2 5 6 6 6-6" />
                        </svg>
                    </summary>
                    <div class="accordion-body">
                        Content
                    </div>
                </details>

                <details class="accordion-item">
                    <summary class="accordion-header d-flex gap-5">
                        <span class="fw-bold flex-grow-1">Player 2</span>
                        <select class="form-control" id="player2Type" style="max-width: 150px;">
                            <option value="0" selected>Human</option>
                            <option value="1">Computer</option>
                        </select>
                        <svg class="accordion-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m2 5 6 6 6-6" />
                        </svg>
                    </summary>
                    <div class="accordion-body">
                        Content
                    </div>
                </details>
            </div>

            <div class="d-flex flex-row justify-content-center gap-3 w-75">
                <a href="index.html" class="btn btn-outline-primary btn-lg mt-5 flex-grow-1">
                    Back
                </a>

                <button id="start" class="btn-solid theme-primary btn-lg mt-5 flex-grow-1">
                    Start
                </button>
            </div>


            <p id="warningMessage" class="fg-danger mt-5 d-none">
                Both players cannot be computers.
            </p>
        </div>

    </div>


    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
