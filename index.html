<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territory Game</title>
    <link rel="stylesheet" href="home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script src="home.js" defer></script>
</head>

<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center p-3">
        <div class="card shadow border-0 p-10 text-center w-100" style="max-width: 400px; height: 350px;">

            <h1 class="fw-bold">Territory Game</h1>

            <div class="d-flex flex-column gap-5 mt-auto">
                <a href="menu.html" class="btn-solid theme-primary btn-lg w-100">
                    Play
                </a>

                <button type="button" id="tutorial" class="btn-solid btn-lg w-100"
                    data-bs-toggle="dialog" data-bs-target="#tutorialDialog">
                    Tutorial
                </button>

                <dialog class="dialog w-50" id="tutorialDialog">
                    <div class="dialog-header">
                        <h1 class="dialog-title" id="tutorialTitle">Tutorial (1/3)</h1>

                        <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close">
                        </button>
                    </div>

                    <div class="dialog-body">
                        <div id="tutorialContent">
                            <!-- Content will be inserted by JavaScript -->
                        </div>
                    </div>

                    <div class="dialog-footer d-flex justify-content-between">
                        <button type="button" id="prevPage" class="btn-solid">
                            Previous
                        </button>

                        <button type="button" id="nextPage" class="btn-solid theme-primary">
                            Next
                        </button>
                    </div>
                </dialog>
            </div>

        </div>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
